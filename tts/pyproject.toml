[project]
name = "tts-asr"
version = "0.1.0"
description = "TTS synthesis (Open JTalk) and Whisper transcription environment"
requires-python = ">=3.12"
dependencies = [
    "openai-whisper==20250625",
    "pyopenjtalk-plus>=0.4.1.post8",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "torchaudio==2.8.0",
    "numpy",
    "pandas",
    "scipy",
    "soundfile",
    "tqdm",
    "packaging",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
