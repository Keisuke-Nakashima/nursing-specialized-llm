[project]
name = "infer"
version = "0.1.0"
description = "vLLM inference environment for the merged Ns-LLM"
requires-python = ">=3.12"
dependencies = [
    "vllm==0.14.1",
    "torch==2.9.1+cu128",
    "torchvision==0.24.1+cu128",
    "torchaudio==2.9.1+cu128",
    "torchao==0.15.0",
    "transformers==4.57.3",
    "bitsandbytes==0.49.0",
    "peft==0.18.0",
    "accelerate==1.12.0",
    "unsloth==2025.12.10",
    "unsloth-zoo==2025.12.8",
    "triton==3.5.1",
    "ninja",
    "numpy<2.3",
    "pandas==2.3.3",
    "openpyxl>=3.1.5",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchao = { index = "pytorch-cu128" }
